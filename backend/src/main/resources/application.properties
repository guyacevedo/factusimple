spring.application.name=factusimple

# ?? Perfiles ????????????????????????????????????????????????????????????????
# Sin perfil por defecto a propósito: si en el servidor se olvida la variable,
# la app arranca con esta configuración segura (sin Swagger, sin SQL en el log)
# en lugar de caer en "dev".
#   Producción: SPRING_PROFILES_ACTIVE=prod   (Spring Boot la lee solo)
#   Local:      perfil "dev" desde el IDE, o mvn spring-boot:run -Dspring-boot.run.profiles=dev

# ?? Servidor ????????????????????????????????????????????????????????????????
server.port=${PORT:8080}

# ?? Base de datos ???????????????????????????????????????????????????????????
# Sin valores por defecto: si falta una variable, la app no arranca (mejor que
# conectarse a la base equivocada). Los valores locales están en application-dev.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Con hilos virtuales, el pool es el límite real de concurrencia contra la BD.
# El login usa 2 conexiones a la vez (REQUIRES_NEW para registrar intentos).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# ?? JPA ?????????????????????????????????????????????????????????????????????
# El esquema lo maneja solo Flyway.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Lazy collections (product taxes) load in batches instead of one query per row.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ?? Flyway ??????????????????????????????????????????????????????????????????
# enabled=true y validate-on-migrate=true ya son el valor por defecto.
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.flyway.placeholders.admin-email=${ADMIN_EMAIL:}
#UnaClaveTemporalLarga#2026
spring.flyway.placeholders.admin-password-hash=${ADMIN_PASSWORD_HASH:}

# ?? Hilos virtuales (Java 21) ???????????????????????????????????????????????
spring.threads.virtual.enabled=true

# ?? Actuator ????????????????????????????????????????????????????????????????
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# ?? Swagger / OpenAPI: apagado salvo que un perfil lo encienda ?????????????
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ?? Aplicación ??????????????????????????????????????????????????????????????
app.frontend-url=${FRONTEND_URL}
# Orígenes del frontend separados por coma, ej. https://app.factusimple.co
app.cors.allowed-origins=${ALLOWED_ORIGINS}

# JWT: mínimo 32 bytes. Generar con: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-minutes=30
app.jwt.refresh-token-days=30

# POS: ventas en espera abiertas a la vez por establecimiento.
app.pos.max-held-sales=10
