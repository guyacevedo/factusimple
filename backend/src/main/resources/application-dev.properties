# Perfil de desarrollo: valores locales, SQL visible y Swagger encendido.

# ?? Base de datos local (las variables siguen mandando si existen) ?????????
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE_NAME:factusimple}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ?? Aplicación ??????????????????????????????????????????????????????????????
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}
# Solo para local. En cualquier otro entorno se define JWT_SECRET.
app.jwt.secret=${JWT_SECRET:dev-only-secret-no-usar-en-produccion-0123456789}

# ?? Swagger ?????????????????????????????????????????????????????????????????
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ?? Logs ????????????????????????????????????????????????????????????????????
# Mejor que show-sql: pasa por el logger (con hora e hilo) y muestra los parámetros.
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.guyacevedo.factusimple=DEBUG
logging.level.org.flywaydb=INFO