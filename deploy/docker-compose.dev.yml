services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: America/Bogota
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - factusimple_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  factusimple_data:
